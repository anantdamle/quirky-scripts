# Style checks on every push and pull request: the Google-style pre-commit
# hooks, then super-linter with the same settings as scripts/super-lint.
name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  pre-commit:
    name: pre-commit (Google style)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  super-linter:
    name: super-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          # super-linter needs the full history to find changed files
          fetch-depth: 0
          persist-credentials: false
      - name: Load super-linter settings
        run: grep -E '^[A-Z_]+=' .github/super-linter.env >> "$GITHUB_ENV"
      - uses: super-linter/super-linter/slim@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
